<div class="back-color sidebar-menu h-full rounded-md flex flex-col p-2">
    <ul class="flex-grow">
      @for(item of items; track item.link){
      <li>
        <a [routerLink]="item.link" class="hover:bg-[#1f2d3e] block w-full px-3 py-2">
          <i class="pi mr-1" [ngClass]="item.icon"></i>
          {{ item.access }}
        </a>
      </li>
      }
    </ul>
    <a (click)="showConfirm()" class="cursor-pointer px-3 py-2 rounded-md user-name">
      <i class="pi pi-user mr-1"></i>
      {{ userName }}
    </a>
  </div>
  
<div class="card flex justify-center">
  <p-toast
    position="center"
    key="confirm"
    (onClose)="onReject()"
    [baseZIndex]="5000"
  >
    <ng-template let-message #message>
      <div class="flex flex-col items-start flex-auto">
        <div class="flex items-center gap-2">
          <i class="pi pi-user"></i>
          <span class="font-bold">{{ userName }}</span>
          <p>aa</p>
        </div>
        <div class="font-medium text-lg my-4">{{ message.summary }}</div>
        <p-button
          severity="success"
          size="small"
          label="Reply"
          (click)="onConfirm()"
        />
      </div>
    </ng-template>
  </p-toast>
</div>
