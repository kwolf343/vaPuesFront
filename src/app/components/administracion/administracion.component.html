<div class="min-h-full flex flex-col h-full">
  <div class="list-superior">
    <ul class="flex gap-4 list-none p-0 m-0">
      <li>
        <button class="px-2 py-3 sm:px-5 p-button-1">Plantillas</button>
      </li>
      <li>
        <button class="px-2 py-3 sm:px-5 p-button-2">Temas</button>
      </li>
      <li>
        <button class="px-2 py-3 sm:px-5 p-button-3 ">Slider</button>
      </li>
      <li>
        <button class="px-2 py-3 sm:px-5 p-button-4">Pie de página</button>
      </li>
    </ul>
  </div>
  <div class="mt-3 flex-1 h-0 overflow-auto">
    <div class="flex gap-2 h-full">
      <div class="w-[25%] md:w-[20%] rounded-md">
        <ul class="flex flex-col gap-y-2">
          @for(categoria of categorias; track categoria){
            <li>
              <button class="back-color p-1 rounded-md w-full">{{categoria}}</button>
            </li>
          }
        </ul>
      </div>
      <div class="back-color w-[75%] md:w-[80%] rounded-md px-2 py-1">
        
      </div>
    </div>
  </div>
</div>
