<div class="card p-4">
  <div class="row">
    <!-- Login -->
    <div class="col-12 col-md-6 d-flex flex-column align-items-center justify-content-center gap-3 py-4">
      <p-card header="Simple Card">
        <p class="m-0">
            Lorem ipsum dolor sit amet...
        </p>
      </p-card>
    </div>
    <!-- Sign Up -->
    <div class="col-12 col-md-6 d-flex align-items-center justify-content-center py-4">
      <p-card class="col-10">
      <div class="login-container col-12">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div *ngIf="error" class="alert alert-danger">{{error}}</div>
          
          <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" formControlName="email" class="form-control">
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger">
              Usuario es requerido
            </div>
          </div>
          
          <div class="form-group">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" formControlName="clave" class="form-control">
            <div *ngIf="loginForm.get('clave')?.invalid && loginForm.get('clave')?.touched" class="text-danger">
              Contraseña es requerida
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
            Iniciar Sesión
          </button>
        </form>

    </div>
  </p-card>
    </div>
  </div>
</div>
