<div class="p-4 min-vh-100 d-flex align-items-center background">
  <div class="row col-12">
    <!-- Login: ocultar en pantallas pequeñas -->
    <div class="col-12 col-md-6 d-none d-md-flex flex-column align-items-center justify-content-center gap-3 py-4">
      <p-card header="Simple Card">
        <p class="m-0">
          Lorem ipsum dolor sit amet...
        </p>
      </p-card>
    </div>

    <!-- Sign Up: ocupar 100% en pantallas pequeñas -->
    <div class="col-12 col-md-6 d-flex align-items-center justify-content-center py-4">
      <p-card class="col-10 px-3">
        <div class="login-container col-12 px-3">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div *ngIf="error" class="alert alert-danger">{{error}}</div>

            <div class="form-group mt-3">
              <label for="email">Email</label>
              <input type="text" id="email" formControlName="email" class="form-control">
            </div>

            <div class="form-group mt-3">
              <label for="clave">Contraseña</label>
              <input type="password" id="clave" formControlName="clave" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary mt-4" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
              Iniciar Sesión
            </button>
          </form>
        </div>
      </p-card>
    </div>
  </div>
</div>
